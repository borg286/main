name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Extract ECR layer footprints via target manifest array and mirror to GAR
      - name: Locate and Mirror NativeLink Layers
        run: |
          echo "==> Fetching public OCI registry anonymous token..."
          TOKEN=$(curl -s "https://public.ecr.aws/token/?service=public.ecr.aws&scope=repository:b1l4l6w7/tracemachina/nativelink:pull" | jq -r '.token')

          echo "==> Downloading specialized layer transport..."
          curl -LO https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          mkdir -p oras-bin && tar -zxf oras_1.2.0_linux_amd64.tar.gz -C oras-bin

          echo "==> Pulling full OCI registry blob manifest matrix..."
          # Target the explicit metadata registry point to access the repository configuration space
          ./oras-bin/oras blob fetch \
            -H "Authorization: Bearer $TOKEN" \
            --output manifest.json \
            public.ecr.aws/b1l4l6w7/tracemachina/nativelink@sha256:c5bfb8baffb3204e6b24f080c1f928ea3401ef5ed0f688d6c2ee9951438b86b7

          echo "=== Manifest Layout Map ==="
          cat manifest.json

          echo "==> Extracting underlying archive package layer..."
          # Dig into the layers to find the data blob containing the chart binary
          CHART_BLOB=$(jq -r '.layers[0].digest' manifest.json)
          echo "Target binary blob resolved to: $CHART_BLOB"

          echo "==> Extracting compiled chart archive bytes..."
          ./oras-bin/oras blob fetch \
            -H "Authorization: Bearer $TOKEN" \
            --output nativelink-0.6.2.tgz \
            public.ecr.aws/b1l4l6w7/tracemachina/nativelink@$CHART_BLOB

          echo "==> Verifying artifact validation signature..."
          ls -lh nativelink-0.6.2.tgz
          file nativelink-0.6.2.tgz

          echo "==> Authenticating into Google Artifact Registry..."
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          echo "==> Injecting final OCI layer target to GAR..."
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
