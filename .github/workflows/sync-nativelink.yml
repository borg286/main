name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub UI

permissions:
  contents: read
  id-token: write # Absolute requirement for requesting the OIDC federated token

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud using your brand new OIDC Pool
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          service_account: '' # Intentionally blank: using direct principalSet mapping

      # 2. Log directly into Google Artifact Registry using the federated access token
      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # 3. Stream the chart layer-by-layer across cloud backends using Skopeo
      - name: Sync OCI Artifact via Skopeo
        run: |
          skopeo copy \
            --src-no-creds \
            docker://public.ecr.aws/b1l4l6w7/tracemachina/nativelink:0.6.2 \
            docker://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo/nativelink:0.6.2
