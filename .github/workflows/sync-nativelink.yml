name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Clear the helper conflict, pull anonymously, and push to GAR
      - name: Mirror NativeLink Chart Natively
        run: |
          # 1. Temporarily move the runner's Docker config out of the way to disable the broken AWS helper
          if [ -f ~/.docker/config.json ]; then
            mv ~/.docker/config.json ~/.docker/config.json.bak
          fi

          # 2. Pull the chart cleanly as a pure anonymous public user
          helm pull oci://public.ecr.aws/b1l4l6w7/tracemachina/nativelink --version 0.6.2

          # 3. Restore the configuration framework
          mkdir -p ~/.docker
          if [ -f ~/.docker/config.json.bak ]; then
            mv ~/.docker/config.json.bak ~/.docker/config.json
          fi

          # 4. Fresh authenticate back into your Google Artifact Registry target
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          # 5. Push the validated archive straight into your GAR repository
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
