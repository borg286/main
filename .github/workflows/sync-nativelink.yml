name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Discover the exact AWS ECR Public chart path and tags
      - name: Discover ECR Public Repository Layout
        run: |
          echo "=== Listing all public repositories under alias b1l4l6w7 ==="
          aws ecr-public describe-repositories \
            --registry-id b1l4l6w7 \
            --region us-east-1 \
            --query 'repositories[*].repositoryName' \
            --output table

          echo "=== Listing tags for tracemachina/nativelink ==="
          aws ecr-public describe-image-tags \
            --registry-id b1l4l6w7 \
            --repository-name tracemachina/nativelink \
            --region us-east-1 \
            --query 'imageTagDetails[*].imageTag' \
            --output json
