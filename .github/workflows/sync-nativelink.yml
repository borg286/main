name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Perform a direct OCI-to-OCI copy with explicit binary pathing
      - name: Mirror NativeLink via OCI Copy
        run: |
          echo "==> Fetching public OCI registry anonymous token..."
          TOKEN=$(curl -s "https://public.ecr.aws/token/?service=public.ecr.aws&scope=repository:b1l4l6w7/tracemachina/nativelink:pull" | jq -r '.token')

          echo "==> Ensuring ORAS binary is available in PATH..."
          # We know the binary was downloaded in previous attempts, but let's be explicit:
          if [ ! -f "./oras" ]; then
            curl -LO https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
            tar -zxf oras_1.2.0_linux_amd64.tar.gz oras
          fi
          chmod +x ./oras

          echo "==> Performing direct OCI-to-OCI mirror..."
          # Use ./oras to ensure it executes the binary in the local working directory
          ./oras copy \
            public.ecr.aws/b1l4l6w7/tracemachina/nativelink:artifacthub.io \
            us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo/nativelink:0.6.2 \
            --from-password "$TOKEN" \
            --to-username oauth2accesstoken \
            --to-password "$(gcloud auth print-access-token)"
