name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Fetch the official release chart package directly from GitHub Releases and push to GAR
      - name: Mirror NativeLink Chart via GitHub Release Source
        run: |
          echo "==> Downloading official NativeLink chart archive v0.6.2..."
          # Pull down the verified chart tarball directly from the source repository release assets
          curl -LO "https://github.com/TraceMachina/nativelink/releases/download/v0.6.2/nativelink-0.6.2.tgz"

          echo "==> Verifying downloaded archive footprint..."
          ls -lh nativelink-0.6.2.tgz

          echo "==> Authenticating to Google Artifact Registry..."
          # Seamlessly authenticates back to your private central repository via Workload Identity
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          echo "==> Injecting OCI layer into target GAR repository..."
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
