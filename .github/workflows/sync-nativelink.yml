name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Pull the chart using a completely isolated workspace context and push to GAR
      - name: Sterile Context Helm Mirror & Log Inspection
        run: |
          echo "==> Preparing clear isolation sandbox..."
          mkdir -p helm-sandbox
          cd helm-sandbox

          echo "==> Executing sterile helm pull with maximum verbose tracking..."
          # By unsetting the global auth vars and driving a clean subshell, 
          # we force Helm to use a guest transport without attaching GCP token context.
          (
            unset GOOGLE_APPLICATION_CREDENTIALS
            unset CLOUDSDK_AUTH_CREDENTIAL_FILE
            helm pull oci://public.ecr.aws/b1l4l6w7/tracemachina/nativelink \
              --version 0.6.2 \
              --debug
          )

          echo "==> Validating sandbox output contents..."
          ls -lh
          
          CHART_PACKAGE=$(ls *.tgz 2>/dev/null | head -n 1)
          if [ -z "$CHART_PACKAGE" ]; then
            echo "CRITICAL: Helm package download could not be located on disk."
            exit 1
          fi

          echo "==> Authenticating into target Google Artifact Registry..."
          # Return to the primary shell context where gcloud credentials are active
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          echo "==> Injecting verified package layer to GAR..."
          helm push "$CHART_PACKAGE" oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
