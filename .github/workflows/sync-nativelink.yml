name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Fetch the Helm archive layer bypassing ambient runner environment maps
      - name: Fetch and Mirror NativeLink Chart
        run: |
          echo "==> Fetching public repository bearer token..."
          TOKEN=$(env -i curl -s "https://public.ecr.aws/token/?service=public.ecr.aws&scope=repository:b1l4l6w7/tracemachina/nativelink:pull" | jq -r '.token')
          
          echo "==> Fetching OCI Chart Index Manifest..."
          # Force an completely clean environment to prevent the GitHub runner from leaking metadata headers
          MANIFEST=$(env -i curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://public.ecr.aws/v2/b1l4l6w7/tracemachina/nativelink/manifests/0.6.2")
          
          echo "==> Extracting layout content digest..."
          # If it's a multi-architecture index manifest, grab the first image layer descriptor
          BLOB_DIGEST=$(echo "$MANIFEST" | jq -r 'if .layers then .layers[0].digest else .manifests[0].digest end')
          
          if [ "$BLOB_DIGEST" == "null" ] || [ -z "$BLOB_DIGEST" ]; then
            echo "Failed to locate artifact layers. Registry response:"
            echo "$MANIFEST"
            exit 1
          fi
          
          # If the digest pointed to a sub-manifest index, resolve the underlying target layer
          if echo "$MANIFEST" | jq -e '.manifests' >/dev/null; then
            echo "==> Resolving inner target manifest layers: $BLOB_DIGEST"
            SUB_MANIFEST=$(env -i curl -s -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://public.ecr.aws/v2/b1l4l6w7/tracemachina/nativelink/manifests/$BLOB_DIGEST")
            BLOB_DIGEST=$(echo "$SUB_MANIFEST" | jq -r '.layers[0].digest')
          fi

          echo "==> Pulling target package tarball: $BLOB_DIGEST"
          env -i curl -L -H "Authorization: Bearer $TOKEN" \
            "https://public.ecr.aws/v2/b1l4l6w7/tracemachina/nativelink/blobs/$BLOB_DIGEST" \
            -o nativelink-0.6.2.tgz

          echo "==> Authenticating back into Google Artifact Registry..."
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          echo "==> Injecting OCI archive into target GAR repository..."
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
            --output json
