name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Fetch the Helm layer directly via raw OCI API calls and push to GAR
      - name: Fetch and Mirror NativeLink Chart
        run: |
          echo "==> Requesting an public bearer token from AWS ECR..."
          TOKEN=$(curl -s "https://public.ecr.aws/token/?service=public.ecr.aws&scope=repository:b1l4l6w7/tracemachina/nativelink:pull" | jq -r '.token')
          
          echo "==> Retrieving the OCI manifest for version 0.6.2..."
          MANIFEST=$(curl -s -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://public.ecr.aws/v2/b1l4l6w7/tracemachina/nativelink/manifests/0.6.2")
          
          # Inspect the manifest content to extract the actual chart layer blob digest
          echo "==> Extracting Helm chart layer digest..."
          BLOB_DIGEST=$(echo "$MANIFEST" | jq -r '.layers[0].digest')
          
          if [ "$BLOB_DIGEST" == "null" ] || [ -z "$BLOB_DIGEST" ]; then
            echo "Failed to parse manifest layers. Raw response:"
            echo "$MANIFEST"
            exit 1
          fi
          
          echo "==> Downloading chart tarball layer: $BLOB_DIGEST"
          curl -L -H "Authorization: Bearer $TOKEN" \
            "https://public.ecr.aws/v2/b1l4l6w7/tracemachina/nativelink/blobs/$BLOB_DIGEST" \
            -o nativelink-0.6.2.tgz

          echo "==> Verifying download..."
          ls -lh nativelink-0.6.2.tgz

          echo "==> Authenticating to Google Artifact Registry..."
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          echo "==> Pushing Helm artifact to target GAR repository..."
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
