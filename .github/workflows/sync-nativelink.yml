name: Sync NativeLink OCI Chart to GAR

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Authenticate using Workload Identity to generate ambient credentials
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/622867420398/locations/global/workloadIdentityPools/github-actions-pool-v2/providers/github-provider'
          create_credentials_file: true

      # 2. Set up the Helm CLI binary on the runner
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      # 3. Log straight into Google Artifact Registry using helm registry login
      - name: Log in to Google Artifact Registry
        run: |
          gcloud auth print-access-token | helm registry login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

      # 4. Install ORAS and copy the OCI artifact directly between registries
      - name: Mirror Helm Chart via ORAS
        run: |
          # Download and install the ORAS CLI binary
          curl -LO https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          mkdir -p oras-install
          tar -zxf oras_1.2.0_linux_amd64.tar.gz -C oras-install
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_1.2.0_linux_amd64.tar.gz oras-install

          # Log ORAS into GAR using your working access token
          gcloud auth print-access-token | oras login us-central1-docker.pkg.dev \
            --username oauth2accesstoken \
            --password-stdin

          # Robustly copy the Helm OCI artifact layers across registries
          oras cp \
            public.ecr.aws/b1l4l6w7/tracemachina/nativelink:0.6.2 \
            us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo/nativelink:0.6.2
          helm push nativelink-0.6.2.tgz oci://us-central1-docker.pkg.dev/fiery-orb-681/nativelink-repo
